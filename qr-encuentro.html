<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR - Encuentro de Graduados 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.13);padding:40px 48px;max-width:480px;width:100%;text-align:center}
.logo-bar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #e8ecf3}
.uni-rect{background:#1a3a6b;border-radius:8px;padding:6px 14px;color:#fff;font-size:.85rem;font-weight:700;letter-spacing:.5px}
.uni-name{font-size:.9rem;font-weight:600;color:#1a3a6b;line-height:1.3;text-align:left}
h1{font-size:1.45rem;font-weight:700;color:#1a3a6b;margin-bottom:8px}
.date-badge{display:inline-block;background:linear-gradient(90deg,#1a3a6b,#2563eb);color:#fff;border-radius:20px;padding:5px 20px;font-size:.85rem;font-weight:600;margin-bottom:28px}
.qr-wrap{background:#fff;border:3px solid #e8ecf3;border-radius:16px;padding:16px;display:inline-block;margin-bottom:18px;line-height:0}
.qr-wrap canvas,.qr-wrap img{width:260px;height:260px;display:block}
.url-text{font-size:.78rem;color:#64748b;word-break:break-all;margin-bottom:22px;background:#f8fafc;border-radius:8px;padding:8px 12px}
.cta{font-size:1rem;color:#334155;margin-bottom:4px;font-weight:600}
.cta-sub{font-size:.85rem;color:#94a3b8;margin-bottom:28px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-size:.9rem;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a3a6b;color:#fff}
.btn-secondary{background:#e8ecf3;color:#1a3a6b}
.note{margin-top:18px;font-size:.75rem;color:#94a3b8}
@media print{body{background:#fff;padding:0}.card{box-shadow:none;border:1px solid #ddd;max-width:100%}.btn-row,.note{display:none}}
</style>
</head>
<body>
<div class="card">
  <div class="logo-bar">
    <div class="uni-rect">UNIBAGUE</div>
    <div class="uni-name">Universidad<br>de Ibague</div>
  </div>
  <h1>Encuentro de Graduados</h1>
  <div class="date-badge">19 de septiembre de 2026</div>
  <div class="qr-wrap" id="qrContainer"></div>
  <div class="url-text" id="urlText"></div>
  <p class="cta">Escanea y registrate</p>
  <p class="cta-sub">Confirma tu asistencia y actualiza tus datos</p>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
    <button class="btn btn-secondary" onclick="downloadQR()">Descargar PNG</button>
  </div>
  <p class="note">Apunta la camara al codigo para acceder al formulario de registro</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const TARGET_URL = 'https://encuestas-graduados.unibague.edu.co/encuentro.php';

document.getElementById('urlText').textContent = TARGET_URL;

new QRCode(document.getElementById('qrContainer'), {
  text: TARGET_URL,
  width: 260,
  height: 260,
  colorDark: '#1a1a2e',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.M
});

function downloadQR() {
  const canvas = document.querySelector('#qrContainer canvas');
  if (!canvas) {
    const img = document.querySelector('#qrContainer img');
    if (img) {
      const a = document.createElement('a');
      a.href = img.src;
      a.download = 'qr-encuentro-graduados-2026.png';
      a.click();
    }
    return;
  }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'qr-encuentro-graduados-2026.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
